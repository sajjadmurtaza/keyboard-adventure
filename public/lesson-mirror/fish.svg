<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <linearGradient id="fiShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ED6FF"/>
      <stop offset="45%" stop-color="#3BA7E8"/>
      <stop offset="100%" stop-color="#1E6FA8"/>
    </linearGradient>
    <linearGradient id="fiFin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <filter id="fiSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0D3A5C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- side fins -->
  <path d="M18 150 Q8 90 48 70 Q78 100 52 160 Z" fill="url(#fiFin)" stroke="#C45E00" stroke-width="4" filter="url(#fiSoft)"/>
  <path d="M262 150 Q272 90 232 70 Q202 100 228 160 Z" fill="url(#fiFin)" stroke="#C45E00" stroke-width="4" filter="url(#fiSoft)"/>
  <!-- fish hood with open face -->
  <path fill="url(#fiShell)" fill-rule="evenodd" stroke="#155A86" stroke-width="5" filter="url(#fiSoft)" d="
    M140 26c68 0 116 50 116 120 0 80-48 128-116 128S24 226 24 146C24 76 72 26 140 26z
    M140 94c-46 0-78 34-78 74s32 74 78 74 78-34 78-74-32-74-78-74z"/>
  <!-- top fin crest -->
  <path d="M100 42 Q140 8 180 42 Q150 58 140 52 Q130 58 100 42 Z" fill="url(#fiFin)" stroke="#C45E00" stroke-width="3"/>
  <!-- bubble accents -->
  <circle cx="96" cy="58" r="7" fill="#FFD85A" stroke="#C67C00" stroke-width="2"/>
  <circle cx="184" cy="58" r="7" fill="#FFD85A" stroke="#C67C00" stroke-width="2"/>
  <ellipse cx="140" cy="168" rx="78" ry="74" fill="none" stroke="#155A86" stroke-width="6" opacity="0.85"/>
  <ellipse cx="140" cy="168" rx="78" ry="74" fill="none" stroke="#B8E8FF" stroke-width="2.5" opacity="0.65"/>
</svg>

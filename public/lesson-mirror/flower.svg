<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="flPetalA" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFB3C1"/>
      <stop offset="55%" stop-color="#F58BAA"/>
      <stop offset="100%" stop-color="#E04878"/>
    </radialGradient>
    <radialGradient id="flPetalB" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFC2D1"/>
      <stop offset="100%" stop-color="#D63A6A"/>
    </radialGradient>
    <linearGradient id="flLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6E07A"/>
      <stop offset="100%" stop-color="#5FA82E"/>
    </linearGradient>
</defs>
  <!-- Leaf accents -->
  <ellipse cx="42" cy="170" rx="36" ry="18" fill="url(#flLeaf)" stroke="#3F7A18" stroke-width="3" transform="rotate(-30 42 170)"/>
  <ellipse cx="278" cy="170" rx="36" ry="18" fill="url(#flLeaf)" stroke="#3F7A18" stroke-width="3" transform="rotate(30 278 170)"/>
  <!-- 10 petals forming a ring — center left transparent for the child's face -->
  <g>
    <ellipse cx="160" cy="36" rx="36" ry="52" fill="url(#flPetalA)" stroke="#B71C3A" stroke-width="3.5"/>
    <ellipse cx="230" cy="58" rx="36" ry="52" fill="url(#flPetalB)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(36 230 58)"/>
    <ellipse cx="278" cy="118" rx="36" ry="52" fill="url(#flPetalA)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(72 278 118)"/>
    <ellipse cx="278" cy="202" rx="36" ry="52" fill="url(#flPetalB)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(108 278 202)"/>
    <ellipse cx="230" cy="262" rx="36" ry="52" fill="url(#flPetalA)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(144 230 262)"/>
    <ellipse cx="160" cy="284" rx="36" ry="52" fill="url(#flPetalB)" stroke="#B71C3A" stroke-width="3.5"/>
    <ellipse cx="90" cy="262" rx="36" ry="52" fill="url(#flPetalA)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(-144 90 262)"/>
    <ellipse cx="42" cy="202" rx="36" ry="52" fill="url(#flPetalB)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(-108 42 202)"/>
    <ellipse cx="42" cy="118" rx="36" ry="52" fill="url(#flPetalA)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(-72 42 118)"/>
    <ellipse cx="90" cy="58" rx="36" ry="52" fill="url(#flPetalB)" stroke="#B71C3A" stroke-width="3.5" transform="rotate(-36 90 58)"/>
  </g>
  <!-- Soft yellow inner rim around the open face -->
  <circle cx="160" cy="160" r="76" fill="none" stroke="#FFE082" stroke-width="12" opacity="0.95"/>
  <circle cx="160" cy="160" r="70" fill="none" stroke="#F9A825" stroke-width="3" opacity="0.5"/>
  <circle cx="112" cy="78" r="6" fill="#FFFFFF" opacity="0.72"/>
  <circle cx="220" cy="90" r="4.5" fill="#FFFFFF" opacity="0.55"/>
</svg>

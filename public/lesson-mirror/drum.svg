<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="drShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="45%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="drRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>
    <linearGradient id="drStick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#EF6C00"/>
    </linearGradient>
  </defs>
  <!-- Drumsticks -->
  <rect x="48" y="18" width="14" height="86" rx="7" fill="url(#drStick)" stroke="#E65100" stroke-width="3" transform="rotate(-28 55 61)"/>
  <circle cx="42" cy="22" r="12" fill="#FFE0B2" stroke="#E65100" stroke-width="3"/>
  <rect x="258" y="18" width="14" height="86" rx="7" fill="url(#drStick)" stroke="#E65100" stroke-width="3" transform="rotate(28 265 61)"/>
  <circle cx="278" cy="22" r="12" fill="#FFE0B2" stroke="#E65100" stroke-width="3"/>
  <!-- Top rim -->
  <ellipse cx="160" cy="58" rx="118" ry="28" fill="url(#drRim)" stroke="#F57F17" stroke-width="5"/>
  <ellipse cx="160" cy="58" rx="96" ry="16" fill="#FFF8E1" opacity="0.85"/>
  <!-- Drum body with open face window -->
  <path fill="url(#drShell)" fill-rule="evenodd" stroke="#B71C1C" stroke-width="6" d="
    M46 70
    Q46 52 160 52
    Q274 52 274 70
    L274 262
    Q274 286 160 286
    Q46 286 46 262
    Z
    M160 108c-48 0-80 34-80 68s32 68 80 68 80-34 80-68-32-68-80-68z"/>
  <!-- Side lugs (drum hardware) -->
  <rect x="34" y="110" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <rect x="268" y="110" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <rect x="34" y="168" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <rect x="268" y="168" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <rect x="34" y="226" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <rect x="268" y="226" width="18" height="28" rx="6" fill="#FFD54A" stroke="#F57F17" stroke-width="3"/>
  <!-- Bottom rim -->
  <ellipse cx="160" cy="268" rx="116" ry="22" fill="url(#drRim)" stroke="#F57F17" stroke-width="4" opacity="0.95"/>
  <ellipse cx="160" cy="176" rx="76" ry="64" fill="none" stroke="#FFCDD2" stroke-width="5" opacity="0.55"/>
  <circle cx="108" cy="120" r="6" fill="#FFFFFF" opacity="0.65"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" role="img" aria-label="Unicorn">
  <rect width="280" height="240" fill="#F3E8FF"/>
  <!-- body -->
  <ellipse cx="150" cy="145" rx="70" ry="42" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3"/>
  <!-- neck + head -->
  <path fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3"
    d="M175 120 Q195 90 210 70 Q220 55 205 50 Q185 48 175 70 Q165 95 160 115 Z"/>
  <!-- horn -->
  <path fill="#FBBF24" stroke="#D97706" stroke-width="2"
    d="M205 52 L222 18 L212 54 Z"/>
  <!-- ear -->
  <ellipse cx="188" cy="58" rx="10" ry="16" fill="#FCE7F3" stroke="#C4B5FD" stroke-width="2"/>
  <!-- mane -->
  <path fill="none" stroke="#A78BFA" stroke-width="6" stroke-linecap="round"
    d="M198 62 Q185 80 190 105"/>
  <path fill="none" stroke="#F472B6" stroke-width="5" stroke-linecap="round"
    d="M205 68 Q192 88 198 112"/>
  <!-- eye -->
  <circle cx="210" cy="68" r="5" fill="#1F2937"/>
  <circle cx="211.5" cy="66.5" r="1.5" fill="#FFFFFF"/>
  <!-- legs -->
  <rect x="105" y="170" width="12" height="38" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="130" y="172" width="12" height="40" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="160" y="172" width="12" height="40" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="185" y="170" width="12" height="38" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
  <!-- tail -->
  <path fill="none" stroke="#A78BFA" stroke-width="7" stroke-linecap="round"
    d="M85 140 Q55 130 48 160"/>
  <path fill="none" stroke="#F472B6" stroke-width="5" stroke-linecap="round"
    d="M88 150 Q60 155 55 175"/>
</svg>

    M140 96c-46 0-78 34-78 74s32 74 78 74 78-34 78-74-32-74-78-74z"/>
  <path fill="url(#frBelly)" fill-rule="evenodd" opacity="0.55" d="
    M140 28c70 0 118 52 118 118 0 78-48 126-118 126S22 224 22 146C22 80 70 28 140 28z
    M140 96c-46 0-78 34-78 74s32 74 78 74 78-34 78-74-32-74-78-74z"/>
  <!-- bulging eye bumps on hood -->
  <circle cx="78" cy="70" r="30" fill="url(#frShell)" stroke="#3F7A18" stroke-width="4"/>
  <circle cx="202" cy="70" r="30" fill="url(#frShell)" stroke="#3F7A18" stroke-width="4"/>
  <circle cx="78" cy="70" r="14" fill="#FFFFFF"/>
  <circle cx="202" cy="70" r="14" fill="#FFFFFF"/>
  <circle cx="82" cy="72" r="7" fill="#1B2A14"/>
  <circle cx="206" cy="72" r="7" fill="#1B2A14"/>
  <circle cx="84" cy="69" r="2" fill="#FFFFFF"/>
  <circle cx="208" cy="69" r="2" fill="#FFFFFF"/>
  <!-- face rim -->
  <ellipse cx="140" cy="170" rx="78" ry="74" fill="none" stroke="#3F7A18" stroke-width="6" opacity="0.85"/>
  <ellipse cx="140" cy="170" rx="78" ry="74" fill="none" stroke="#E8FFB8" stroke-width="2.5" opacity="0.7"/>
</svg>

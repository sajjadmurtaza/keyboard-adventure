<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <linearGradient id="frShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6F56E"/>
      <stop offset="55%" stop-color="#7BC83C"/>
      <stop offset="100%" stop-color="#4F9A1E"/>
    </linearGradient>
    <linearGradient id="frBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8FFB8"/>
      <stop offset="100%" stop-color="#C5E87A"/>
    </linearGradient>
    <filter id="frSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#2E5A10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- frog hood with open face (child visible) -->
  <path fill="url(#frShell)" fill-rule="evenodd" stroke="#3F7A18" stroke-width="5" filter="url(#frSoft)" d="

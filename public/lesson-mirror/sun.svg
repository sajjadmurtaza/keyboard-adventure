<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="sunCore" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFF6A8"/>
      <stop offset="55%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </radialGradient>
    <linearGradient id="sunRay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F0A020"/>
    </linearGradient>
</defs>
  <!-- 12 golden rays — center left open for the child's face -->
  <g>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(30 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(60 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(90 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(120 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(150 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(180 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(210 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(240 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(270 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(300 160 160)"/>
    <polygon points="160,8 176,70 144,70" fill="url(#sunRay)" stroke="#E08900" stroke-width="2.5" transform="rotate(330 160 160)"/>
  </g>
  <!-- Warm rim around the open face hole -->
  <circle cx="160" cy="160" r="78" fill="none" stroke="url(#sunCore)" stroke-width="16"/>
  <circle cx="160" cy="160" r="70" fill="none" stroke="#F5A623" stroke-width="3" opacity="0.55"/>
  <circle cx="118" cy="88" r="5" fill="#FFFFFF" opacity="0.7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#FFD54F"/>
      <stop offset="75%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#C67C00"/>
    </linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#EF6C00"/>
    </linearGradient>
    <radialGradient id="gRuby" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="gAmethyst" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </radialGradient>
    <radialGradient id="gSapphire" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </radialGradient>
    <filter id="gSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5A3A00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- velvet cushion hint under band -->
  <ellipse cx="150" cy="168" rx="118" ry="16" fill="#6A1B9A" opacity="0.35"/>
  <!-- band -->
  <rect x="28" y="128" width="244" height="44" rx="12" fill="url(#gBand)" stroke="#8D5A00" stroke-width="5" filter="url(#gSoft)"/>
  <rect x="40" y="138" width="220" height="10" rx="4" fill="#FFF8E1" opacity="0.45"/>
  <!-- ornate points -->
  <g filter="url(#gSoft)">
    <path d="M40 128 L68 28 L96 128 Z" fill="url(#gGold)" stroke="#8D5A00" stroke-width="4"/>
    <path d="M96 128 L150 12 L204 128 Z" fill="url(#gGold)" stroke="#8D5A00" stroke-width="4"/>
    <path d="M204 128 L232 28 L260 128 Z" fill="url(#gGold)" stroke="#8D5A00" stroke-width="4"/>
  </g>
  <!-- inner bevels -->
  <path d="M55 120 L68 48 L81 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M120 118 L150 28 L180 118" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M219 120 L232 48 L245 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  <!-- jewels -->
  <circle cx="68" cy="52" r="14" fill="url(#gRuby)" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  <circle cx="150" cy="34" r="16" fill="url(#gAmethyst)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="232" cy="52" r="14" fill="url(#gSapphire)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="150" r="10" fill="url(#gSapphire)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="11" fill="url(#gRuby)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="10" fill="#43A047" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- jewel sparkles -->
  <circle cx="150" cy="28" r="3" fill="#FFFFFF"/>
  <circle cx="64" cy="46" r="2.5" fill="#FFFFFF"/>
  <circle cx="236" cy="46" r="2.5" fill="#FFFFFF"/>
</svg>

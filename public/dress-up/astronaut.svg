<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <linearGradient id="aShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="35%" stop-color="#C8D4E4"/>
      <stop offset="70%" stop-color="#8FA3BB"/>
      <stop offset="100%" stop-color="#5E738C"/>
    </linearGradient>
    <linearGradient id="aRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF3F8"/>
      <stop offset="50%" stop-color="#9AADC2"/>
      <stop offset="100%" stop-color="#6B8098"/>
    </linearGradient>
    <linearGradient id="aNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5DEE8"/>
      <stop offset="100%" stop-color="#6A7C90"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="40%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="aSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1a2430" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- neck ring -->
  <ellipse cx="140" cy="262" rx="78" ry="24" fill="url(#aNeck)" stroke="#4A5C70" stroke-width="5" filter="url(#aSoft)"/>
  <ellipse cx="140" cy="254" rx="62" ry="14" fill="#7A8B9C"/>
  <ellipse cx="140" cy="250" rx="48" ry="8" fill="#4F6174"/>
  <!-- side hubs -->
  <g filter="url(#aSoft)">
    <circle cx="28" cy="150" r="22" fill="url(#aRim)" stroke="#4A5C70" stroke-width="4"/>
    <circle cx="28" cy="150" r="10" fill="#2B3A4A"/>
    <circle cx="28" cy="150" r="4" fill="#7ED6FF"/>
    <circle cx="252" cy="150" r="22" fill="url(#aRim)" stroke="#4A5C70" stroke-width="4"/>
    <circle cx="252" cy="150" r="10" fill="#2B3A4A"/>
    <circle cx="252" cy="150" r="4" fill="#7ED6FF"/>
  </g>
  <!-- helmet shell with open face (child visible) -->
  <path fill="url(#aShell)" fill-rule="evenodd" stroke="#3D4F63" stroke-width="6" filter="url(#aSoft)" d="
    M140 22c62 0 112 48 112 118 0 78-50 132-112 132S28 218 28 140C28 70 78 22 140 22z
    M140 78c-42 0-72 32-72 72s30 72 72 72 72-32 72-72-30-72-72-72z"/>
  <path fill="url(#aGlow)" fill-rule="evenodd" d="
    M140 22c62 0 112 48 112 118 0 78-50 132-112 132S28 218 28 140C28 70 78 22 140 22z
    M140 78c-42 0-72 32-72 72s30 72 72 72 72-32 72-72-30-72-72-72z"/>
  <!-- visor rim -->
  <ellipse cx="140" cy="150" rx="74" ry="74" fill="none" stroke="#1E2A38" stroke-width="8" opacity="0.9"/>
  <ellipse cx="140" cy="150" rx="74" ry="74" fill="none" stroke="#B8C8D8" stroke-width="3" opacity="0.7"/>
  <!-- metallic highlight arc -->
  <path d="M78 108 Q140 58 202 108" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>
  <path d="M88 220 Q140 248 192 220" fill="none" stroke="#2A3A4C" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- status lights -->
  <circle cx="96" cy="56" r="6" fill="#7ED6A5"/>
  <circle cx="140" cy="48" r="6" fill="#FFD85A"/>
  <circle cx="184" cy="56" r="6" fill="#5CE1FF"/>
</svg>

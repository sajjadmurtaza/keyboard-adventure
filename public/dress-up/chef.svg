<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" width="280" height="250">
  <defs>
    <linearGradient id="cCloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
    <linearGradient id="cBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#C8C8C8"/>
    </linearGradient>
    <radialGradient id="cPuff" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#C9C9C9"/>
    </radialGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3A3A3A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- soft fabric puffs -->
  <g filter="url(#cSoft)">
    <ellipse cx="78" cy="100" rx="58" ry="64" fill="url(#cPuff)" stroke="#BFBFBF" stroke-width="3"/>
    <ellipse cx="202" cy="100" rx="58" ry="64" fill="url(#cPuff)" stroke="#BFBFBF" stroke-width="3"/>
    <ellipse cx="140" cy="58" rx="82" ry="56" fill="url(#cPuff)" stroke="#BFBFBF" stroke-width="3"/>
    <ellipse cx="140" cy="112" rx="100" ry="62" fill="url(#cCloth)" stroke="#BFBFBF" stroke-width="3.5"/>
  </g>
  <!-- fold lines -->
  <path d="M70 88 Q100 70 120 95" fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M160 70 Q190 55 210 88" fill="none" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M90 130 Q140 150 190 130" fill="none" stroke="#B0B0B0" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- soft highlight -->
  <ellipse cx="118" cy="48" rx="36" ry="18" fill="#FFFFFF" opacity="0.55"/>
  <!-- band -->
  <rect x="52" y="168" width="176" height="48" rx="14" fill="url(#cBand)" stroke="#B0B0B0" stroke-width="3.5" filter="url(#cSoft)"/>
  <rect x="64" y="180" width="152" height="12" rx="5" fill="#F7F7F7"/>
  <path d="M68 204 H212" stroke="#D6D6D6" stroke-width="3" stroke-dasharray="7 6"/>
  <!-- tiny stitch accents -->
  <path d="M80 176 H200" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4 5"/>
</svg>

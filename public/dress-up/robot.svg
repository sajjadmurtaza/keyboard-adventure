<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <linearGradient id="rMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="40%" stop-color="#B0BCCB"/>
      <stop offset="100%" stop-color="#5C6B7C"/>
    </linearGradient>
    <linearGradient id="rPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7E0EA"/>
      <stop offset="100%" stop-color="#7A8899"/>
    </linearGradient>
    <linearGradient id="rGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EF0C8"/>
      <stop offset="100%" stop-color="#2BB673"/>
    </linearGradient>
    <filter id="rSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1A2430" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- antenna -->
  <rect x="132" y="10" width="16" height="42" rx="5" fill="#9AA5B4" stroke="#4A5564" stroke-width="3"/>
  <circle cx="140" cy="14" r="14" fill="url(#rGlow)" stroke="#1F6B4A" stroke-width="3" filter="url(#rSoft)"/>
  <circle cx="140" cy="14" r="5" fill="#E8FFF4"/>
  <!-- side bolts -->
  <g filter="url(#rSoft)">
    <circle cx="28" cy="150" r="18" fill="url(#rPanel)" stroke="#3D4A58" stroke-width="4"/>
    <circle cx="28" cy="150" r="7" fill="#2B3645"/>
    <circle cx="252" cy="150" r="18" fill="url(#rPanel)" stroke="#3D4A58" stroke-width="4"/>
    <circle cx="252" cy="150" r="7" fill="#2B3645"/>
  </g>
  <!-- helmet with open face window -->
  <path fill="url(#rMetal)" fill-rule="evenodd" stroke="#3D4A58" stroke-width="6" filter="url(#rSoft)" d="
    M48 58h184c18 0 32 14 32 32v148c0 22-18 40-40 40H56c-22 0-40-18-40-40V90c0-18 14-32 32-32z
    M70 96h140c12 0 22 10 22 22v88c0 12-10 22-22 22H70c-12 0-22-10-22-22v-88c0-12 10-22 22-22z"/>
  <!-- panel lines -->
  <path d="M56 78 H224" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M56 230 H224" stroke="#2B3645" stroke-opacity="0.35" stroke-width="3"/>
  <!-- window rim -->
  <rect x="70" y="96" width="140" height="132" rx="22" fill="none" stroke="#1B2430" stroke-width="7"/>
  <rect x="70" y="96" width="140" height="132" rx="22" fill="none" stroke="#A8B6C6" stroke-width="2.5" opacity="0.7"/>
  <!-- corner LEDs -->
  <circle cx="86" cy="112" r="6" fill="#FF6B6B"/>
  <circle cx="194" cy="112" r="6" fill="#5CE1FF"/>
  <!-- chin lights -->
  <circle cx="100" cy="248" r="9" fill="#FF6B6B" stroke="#8B1E1E" stroke-width="2"/>
  <circle cx="140" cy="248" r="9" fill="#FFD85A" stroke="#8D6E00" stroke-width="2"/>
  <circle cx="180" cy="248" r="9" fill="#7ED6A5" stroke="#2F6F55" stroke-width="2"/>
  <!-- metallic sheen on top plate -->
  <path d="M64 70 Q140 52 216 70" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
</svg>
